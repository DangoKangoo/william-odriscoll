# Checks every link in the built site: internal assets (file) and external sites.
scheme = ["https", "http", "file"]
exclude = [
  # This site's own URLs (canonical, og:image) do not exist until the first deploy.
  '^https?://dangokangoo\.github\.io',
  '^https?://localhost',
]
max_retries = 3
timeout = 20
accept = ["200..=299", "429"]
